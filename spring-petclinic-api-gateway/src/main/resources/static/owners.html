<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - Banque Populaire</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/bcp-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/logo-bcp.png" alt="BCP" class="logo-bcp" onerror="this.style.display='none'">
                BANQUE POPULAIRE
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="/owners.html">
                            <i class="fas fa-users"></i> Clients
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/vets.html">
                            <i class="fas fa-user-tie"></i> Conseillers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i> Accueil
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-users"></i> Liste des Clients</h3>
                <p class="mb-0">Gestion des clients de la Banque Populaire</p>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="clientsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Adresse</th>
                                <th>Ville</th>
                                <th>Téléphone</th>
                                <th>Comptes (Animaux)</th>
                            </tr>
                        </thead>
                        <tbody id="clientsBody">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <i class="fas fa-spinner fa-spin fa-2x text-bcp-orange"></i>
                                    <p class="mt-2">Chargement des données...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <div class="container text-center">
            <p>&copy; 2026 Banque Populaire du Maroc - Tous droits réservés</p>
            <p><strong>Grandir. Ensemble.</strong></p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Charger les données depuis l'API
        fetch('/api/customer/owners')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur réseau');
                }
                return response.json();
            })
            .then(data => {
                const tbody = document.getElementById('clientsBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Aucun client trouvé</td></tr>';
                    return;
                }
                
                data.forEach(client => {
                    // Extraire les informations des animaux (futurs comptes)
                    const pets = client.pets && client.pets.length > 0
                        ? client.pets.map(p => `${p.name} (${p.type.name})`).join(', ')
                        : '<em class="text-muted">Aucun compte</em>';
                    
                    const row = `
                        <tr>
                            <td><strong>${client.id}</strong></td>
                            <td>${client.lastName}</td>
                            <td>${client.firstName}</td>
                            <td>${client.address}</td>
                            <td>${client.city}</td>
                            <td>${client.telephone}</td>
                            <td>${pets}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('clientsBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                            Erreur de chargement des données. Veuillez vérifier que les services sont démarrés.
                        </td>
                    </tr>
                `;
            });
    </script>
</body>
</html>
